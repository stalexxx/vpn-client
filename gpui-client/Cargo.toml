[package]
name = "vpn-gpui"
version = "0.3.35"
edition = "2021"

[dependencies]
gpui = "0.2.2"
vpn-core = { path = ".." }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSResponder", "NSView", "objc2-core-foundation"] }
