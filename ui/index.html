<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="style.css"><title>VPN Client</title></head>
<body><main class="client-shell">
  <header class="topbar"><div class="brand-mark" aria-hidden="true">V</div><div class="brand-copy"><h1>VPN Client</h1><p id="build-info">Загрузка…</p></div><div id="connection-state" class="state-pill" data-state="off"><span class="state-dot"></span><span id="connection-label">Отключено</span></div></header>
  <section class="connection-card"><div><p class="eyebrow">ЗАЩИЩЁННОЕ ПОДКЛЮЧЕНИЕ</p><h2 id="connection-heading">Готовы к работе</h2><p id="active-profile-label" class="active-profile">Выберите конфигурацию</p></div><button id="vpn-toggle" class="vpn-toggle" type="button" aria-pressed="false"><span class="toggle-symbol" aria-hidden="true">↗</span><span id="toggle-label">Подключить</span></button><p id="connection-message" class="connection-message" role="status">Весь системный трафик пойдёт через TUN.</p><p id="connection-error" class="connection-error" role="alert" hidden></p></section>
  <section class="config-section"><div class="section-heading"><div><p class="eyebrow">ДОСТУПНЫ ДЛЯ ПОДКЛЮЧЕНИЯ</p><h2>Конфигурации</h2></div><button id="refresh" class="icon-button" type="button" title="Обновить список" aria-label="Обновить список">↻</button></div><div id="profiles" class="profiles-list" aria-live="polite"><p class="empty-state">Загружаем конфигурации…</p></div></section>
  <footer><span id="proxy-indicator" class="footer-status">Глобальный TUN выключен</span><button id="open-admin" class="admin-link" type="button">Администрирование</button></footer>
</main><script src="app.js"></script></body></html>
