[package]
name = "vpn-desktop"
version = "0.2.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
vpn-core = { path = ".." }
serde_json = "1"
tempfile = "3"
qrcode = { version = "0.14", default-features = false }

serde = { version = "1", features = ["derive"] }
url = "2"
